# Server Config
server.port = 8085
server.error.include-stacktrace = never

# Database Config
spring.datasource.url = jdbc:mysql://${ELECTRO_DB_HOST:localhost}:${ELECTRO_DB_PORT:3306}/${ELECTRO_DB_NAME:electro}?useSSL=true&serverTimezone=UTC
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.username = ${ELECTRO_DB_USERNAME:root}
spring.datasource.password = ${ELECTRO_DB_PASSWORD}

# JPA Config
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto = none
spring.jpa.properties.hibernate.connection.CharSet = UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding = UTF-8
spring.jpa.properties.hibernate.connection.useUnicode = true
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
## `always` or `never`
spring.sql.init.mode = never

# Servlet
server.servlet.encoding.charset = UTF-8
server.servlet.encoding.enabled = true
server.servlet.encoding.force = true

# Logging
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type = TRACE
logging.level.web = TRACE
logging.level.org.springframework.web = TRACE

# Actuator
management.endpoints.web.exposure.include = mappings

# Springdoc
springdoc.show-actuator = false

# JWT
electro.app.jwtSecret = ${ELECTRO_JWT_SECRET}
electro.app.jwtExpirationMs = ${ELECTRO_JWT_EXPIRATION_MS:10080000}
electro.app.jwtRefreshExpirationMs = ${ELECTRO_JWT_REFRESH_EXPIRATION_MS:86400000}

# Upload
spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 15MB

# Shipping
electro.app.shipping.ghnToken = ${ELECTRO_GHN_TOKEN}
electro.app.shipping.ghnShopId = ${ELECTRO_GHN_SHOP_ID:121327}
electro.app.shipping.ghnApiPath = ${ELECTRO_GHN_API_PATH:https://dev-online-gateway.ghn.vn/shiip/public-api/v2}

# Mail
spring.mail.host = ${ELECTRO_MAIL_HOST:smtp.gmail.com}
spring.mail.port = ${ELECTRO_MAIL_PORT:587}
spring.mail.username = ${ELECTRO_MAIL_USERNAME}
spring.mail.password = ${ELECTRO_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

# PayPal
paypal.baseUrl = ${ELECTRO_PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.clientId = ${ELECTRO_PAYPAL_CLIENT_ID}
paypal.secret = ${ELECTRO_PAYPAL_SECRET}

# Profiles
spring.profiles.active = @spring.profiles.active@


server.port=${ELECTRO_SERVER_PORT:8443}
server.ssl.enabled=${ELECTRO_SSL_ENABLED:true}
server.ssl.key-store=${ELECTRO_SSL_KEYSTORE:classpath:electro-keystore.p12}
server.ssl.key-store-password=${ELECTRO_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${ELECTRO_SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${ELECTRO_SSL_KEY_ALIAS:electro}
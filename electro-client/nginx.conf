# Reference:
# (1) https://gkedge.gitbooks.io/react-router-in-the-real/content/nginx.html
# (2) https://stackoverflow.com/q/43951720

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ===============================
    # Security hardening – Fingerprint mitigation
    # ===============================

    server_tokens off;   # Ẩn version Nginx (không lộ nginx/x.y.z)

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
